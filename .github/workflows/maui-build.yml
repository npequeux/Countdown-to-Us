name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build-blazor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet packages
        run: dotnet restore blazor/CountdownToUs/CountdownToUs.csproj

      - name: Build Blazor project
        run: dotnet build blazor/CountdownToUs/CountdownToUs.csproj --no-restore --configuration Release

      - name: Run tests
        run: dotnet test blazor/CountdownToUs/CountdownToUs.csproj --no-build --verbosity normal || echo "No tests found or all tests passed"

  build-maui-android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Restore NuGet packages
        run: dotnet restore maui/CountdownToUs.Maui/CountdownToUs.Maui.csproj

      - name: Build MAUI Android project
        shell: pwsh
        run: |
          $env:MAUI_PROJECT_PATH = "maui\CountdownToUs.Maui\CountdownToUs.Maui.csproj"
          $env:DOTNET_CLI_TELEMETRY_OPTOUT = 1
          dotnet build $env:MAUI_PROJECT_PATH --no-restore --configuration Release -f net10.0-android

      - name: Publish MAUI Android
        shell: pwsh
        run: |
          $env:MAUI_PROJECT_PATH = "maui\CountdownToUs.Maui\CountdownToUs.Maui.csproj"
          $env:DOTNET_CLI_TELEMETRY_OPTOUT = 1
          dotnet publish $env:MAUI_PROJECT_PATH --no-restore -c Release -f net10.0-android -p:PublishSingleFile=true -p:SelfContained=false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CountdownToUs.Android
          path: |
            build/
            maui/CountdownToUs.Maui/bin/Release/net10.0-android/

  build-maui-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet packages
        run: |
          $env:DOTNET_CLI_TELEMETRY_OPTOUT = 1
          dotnet restore maui/CountdownToUs.Maui/CountdownToUs.Maui.csproj

      - name: Build MAUI iOS project
        shell: pwsh
        run: |
          $env:MAUI_PROJECT_PATH = "maui\CountdownToUs.Maui\CountdownToUs.Maui.csproj"
          $env:DOTNET_CLI_TELEMETRY_OPTOUT = 1
          dotnet build $env:MAUI_PROJECT_PATH --no-restore -c Release -f net8.0-ios

      - name: Publish MAUI iOS
        shell: pwsh
        run: |
          $env:MAUI_PROJECT_PATH = "maui\CountdownToUs.Maui\CountdownToUs.Maui.csproj"
          $env:DOTNET_CLI_TELEMETRY_OPTOUT = 1
          dotnet publish $env:MAUI_PROJECT_PATH --no-restore -c Release -f net8.0-ios -p:PublishSingleFile=true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CountdownToUs.iOS
          path: |
            build/
            maui/CountdownToUs.Maui/bin/Release/net8.0-ios/
