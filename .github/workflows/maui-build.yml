name: MAUI Build

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install MAUI workload
        run: dotnet workload install maui-android --version 10.0.20

      - name: Restore
        run: dotnet restore maui/CountdownToUs.Maui/CountdownToUs.Maui.csproj -p:TargetFrameworks=net10.0-android -c Release

      - name: Build (Android)
        run: dotnet build maui/CountdownToUs.Maui/CountdownToUs.Maui.csproj -f net10.0-android -c Release --no-restore

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install MAUI workload
        run: dotnet workload install maui-windows --version 10.0.20

      - name: Restore
        run: dotnet restore maui/CountdownToUs.Maui/CountdownToUs.Maui.csproj -p:TargetFrameworks=net10.0-windows10.0.19041.0 -r win-x64 -c Release

      - name: Build (Windows)
        run: dotnet build maui/CountdownToUs.Maui/CountdownToUs.Maui.csproj `
          -f net10.0-windows10.0.19041.0 -c Release --no-restore `
          -p:WindowsPackageType=None -r win-x64

  build-linux-desktop:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install MAUI workload
        run: dotnet workload install maui-linux --version 10.0.20

      - name: Restore
        run: dotnet restore maui/CountdownToUs.Maui/CountdownToUs.Maui.csproj -p:TargetFrameworks=net10.0-linux-x64 -c Release

      - name: Build (Linux)
        run: dotnet build maui/CountdownToUs.Maui/CountdownToUs.Maui.csproj -f net10.0-linux-x64 -c Release --no-restore

  build-mac-catalyst:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install MAUI workload
        run: dotnet workload install maui-maccatalyst --version 10.0.20

      - name: Restore
        run: dotnet restore maui/CountdownToUs.Maui/CountdownToUs.Maui.csproj -p:TargetFrameworks=net10.0-maccatalyst -c Release

      - name: Build (macOS Catalyst)
        run: dotnet build maui/CountdownToUs.Maui/CountdownToUs.Maui.csproj -f net10.0-maccatalyst -c Release --no-restore

  # ─── V2 ──────────────────────────────────────────────────────────────────────
  # Build and publish the second MAUI app (V2) as an APK to the Play Store
  # Publish triggers on push to main, pull request targeting main, or manual dispatch.
  # This workflow is disabled by default; enable by removing the "disabled: true" line below.

  build-v2-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install MAUI workload
        run: dotnet workload install maui-android --version 10.0.20

      - name: Restore V2
        run: dotnet restore maui/CountdownToUs.Maui.V2/CountdownToUs.Maui.V2.csproj -p:TargetFrameworks=net10.0-android -c Release

      - name: Build V2 (Android)
        run: dotnet build maui/CountdownToUs.Maui.V2/CountdownToUs.Maui.V2.csproj `
          -f net10.0-android -c Release --no-restore `
          -p:AndroidPackageFormat=apk `
          -p:Configuration=Release `
          -p:VersionSuffix=${{ github.event_name == 'release' && format('-v{0}', github.ref_name) || '' }}

      - name: Upload V2 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CountdownToUs-V2-${{ runner.os }}
          path: maui/CountdownToUs.Maui.V2/bin/Release/net10.0-android/publish/CountdownToUs.V2.apk
          retention-days: 30

      - name: Upload V2 AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: CountdownToUs-V2-${{ runner.os }}-aab
          path: maui/CountdownToUs.Maui.V2/bin/Release/net10.0-android/publish/*.aab
          retention-days: 30

      - name: Publish V2 to Play Store (internal)
        # Requires GOOGLE_APPLICATION_CREDENTIALS env var set with a valid service account key path
        # and the following environment variables configured in the repository settings:
        #   PLAY_STORE_PROJECT_NUMBER, PLAY_STORE_TRACK, PLAY_STORE_SERVICE_ACCOUNT_KEY_PATH
        if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')
        env:
          PLAY_STORE_PROJECT_NUMBER: ${{ vars.PLAY_STORE_PROJECT_NUMBER }}
          PLAY_STORE_TRACK: internal
          PLAY_STORE_SERVICE_ACCOUNT_KEY_PATH: /tmp/keystore/release-key.json
          APK_PATH: maui/CountdownToUs.Maui.V2/bin/Release/net10.0-android/publish/*.apk
        run: |
          $aarPath = "maui\CountdownToUs.Maui.V2\bin\Release\net10.0-android\publish*.aar"

          # Upload the APK to the specified track (e.g., internal, alpha)
          dotnet tool install -g GooglePlayPublisher --no-redirect --version 3.0.0
          $apkDir = Split-Path -Parent "$env:APK_PATH"
          Get-ChildItem -Path "$env:APK_PATH" | ForEach-Object {
            $apkName = $_.Name
            & dotnet GooglePlayPublisher publish `
              --project-number="$env:PLAY_STORE_PROJECT_NUMBER" `
              --track="$env:PLAY_STORE_TRACK" `
              --service-account-key-file="$env:PLAY_STORE_SERVICE_ACCOUNT_KEY_PATH" `
              --package-name="com.npequeux.countdowntov2" `
              --file= "$apkDir/$($apkName)"

            # Upload the corresponding AAB for version tracking
            Get-ChildItem -Path "$aarPath" | ForEach-Object {
              & dotnet GooglePlayPublisher upload `
                --project-number="$env:PLAY_STORE_PROJECT_NUMBER" `
                --track="$env:PLAY_STORE_TRACK" `
                --service-account-key-file="$env:PLAY_STORE_SERVICE_ACCOUNT_KEY_PATH" `
                --file= "$_.FullName"
            }

            # Upload the APK as a release artifact for download
            & dotnet GooglePlayPublisher upload-artifact `
              --project-number="$env:PLAY_STORE_PROJECT_NUMBER" `
              --track="release" `
              --service-account-key-file="$env:PLAY_STORE_SERVICE_ACCOUNT_KEY_PATH" `
              --file= "$apkDir/$($apkName)"
          }

      - name: Publish V2 to Play Store (open)
        # Requires GOOGLE_APPLICATION_CREDENTIALS env var set with a valid service account key path
        # and the following environment variables configured in the repository settings:
        #   PLAY_STORE_PROJECT_NUMBER, PLAY_STORE_TRACK, PLAY_STORE_SERVICE_ACCOUNT_KEY_PATH
        if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')
        env:
          PLAY_STORE_PROJECT_NUMBER: ${{ vars.PLAY_STORE_PROJECT_NUMBER }}
          PLAY_STORE_TRACK: open
          PLAY_STORE_SERVICE_ACCOUNT_KEY_PATH: /tmp/keystore/release-key.json
          APK_PATH: maui/CountdownToUs.Maui.V2/bin/Release/net10.0-android/publish/*.apk
        run: |
          $aarPath = "maui\CountdownToUs.Maui.V2\bin\Release\net10.0-android\publish*.aar"

          # Upload the APK to the specified track (e.g., internal, alpha)
          dotnet tool install -g GooglePlayPublisher --no-redirect --version 3.0.0
          $apkDir = Split-Path -Parent "$env:APK_PATH"
          Get-ChildItem -Path "$env:APK_PATH" | ForEach-Object {
            $apkName = $_.Name
            & dotnet GooglePlayPublisher publish `
              --project-number="$env:PLAY_STORE_PROJECT_NUMBER" `
              --track="$env:PLAY_STORE_TRACK" `
              --service-account-key-file="$env:PLAY_STORE_SERVICE_ACCOUNT_KEY_PATH" `
              --package-name="com.npequeux.countdowntov2" `
              --file= "$apkDir/$($apkName)"

            # Upload the corresponding AAB for version tracking
            Get-ChildItem -Path "$aarPath" | ForEach-Object {
              & dotnet GooglePlayPublisher upload `
                --project-number="$env:PLAY_STORE_PROJECT_NUMBER" `
                --track="$env:PLAY_STORE_TRACK" `
                --service-account-key-file="$env:PLAY_STORE_SERVICE_ACCOUNT_KEY_PATH" `
                --file= "$_.FullName"
            }

            # Upload the APK as a release artifact for download
            & dotnet GooglePlayPublisher upload-artifact `
              --project-number="$env:PLAY_STORE_PROJECT_NUMBER" `
              --track="release" `
              --service-account-key-file="$env:PLAY_STORE_SERVICE_ACCOUNT_KEY_PATH" `
              --file= "$apkDir/$($apkName)"
          }

      - name: Publish V2 to Play Store (testing)
        # Requires GOOGLE_APPLICATION_CREDENTIALS env var set with a valid service account key path
        # and the following environment variables configured in the repository settings:
        #   PLAY_STORE_PROJECT_NUMBER, PLAY_STORE_TRACK, PLAY_STORE_SERVICE_ACCOUNT_KEY_PATH
        if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')
        env:
          PLAY_STORE_PROJECT_NUMBER: ${{ vars.PLAY_STORE_PROJECT_NUMBER }}
          PLAY_STORE_TRACK: testing
          PLAY_STORE_SERVICE_ACCOUNT_KEY_PATH: /tmp/keystore/release-key.json
          APK_PATH: maui/CountdownToUs.Maui.V2/bin/Release/net10.0-android/publish/*.apk
        run: |
          $aarPath = "maui\CountdownToUs.Maui.V2\bin\Release\net10.0-android\publish*.aar"

          # Upload the APK to the specified track (e.g., internal, alpha)
          dotnet tool install -g GooglePlayPublisher --no-redirect --version 3.0.0
          $apkDir = Split-Path -Parent "$env:APK_PATH"
          Get-ChildItem -Path "$env:APK_PATH" | ForEach-Object {
            $apkName = $_.Name
            & dotnet GooglePlayPublisher publish `
              --project-number="$env:PLAY_STORE_PROJECT_NUMBER" `
              --track="$env:PLAY_STORE_TRACK" `
              --service-account-key-file="$env:PLAY_STORE_SERVICE_ACCOUNT_KEY_PATH" `
              --package-name="com.npequeux.countdowntov2" `
              --file= "$apkDir/$($apkName)"

            # Upload the corresponding AAB for version tracking
            Get-ChildItem -Path "$aarPath" | ForEach-Object {
              & dotnet GooglePlayPublisher upload `
                --project-number="$env:PLAY_STORE_PROJECT_NUMBER" `
                --track="$env:PLAY_STORE_TRACK" `
                --service-account-key-file="$env:PLAY_STORE_SERVICE_ACCOUNT_KEY_PATH" `
                --file= "$_.FullName"
            }

            # Upload the APK as a release artifact for download
            & dotnet GooglePlayPublisher upload-artifact `
              --project-number="$env:PLAY_STORE_PROJECT_NUMBER" `
              --track="release" `
              --service-account-key-file="$env:PLAY_STORE_SERVICE_ACCOUNT_KEY_PATH" `
              --file= "$apkDir/$($apkName)"
          }

      - name: Publish V2 to Play Store (production)
        # Requires GOOGLE_APPLICATION_CREDENTIALS env var set with a valid service account key path
        # and the following environment variables configured in the repository settings:
        #   PLAY_STORE_PROJECT_NUMBER, PLAY_STORE_TRACK, PLAY_STORE_SERVICE_ACCOUNT_KEY_PATH
        if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')
        env:
          PLAY_STORE_PROJECT_NUMBER: ${{ vars.PLAY_STORE_PROJECT_NUMBER }}
          PLAY_STORE_TRACK: production
          PLAY_STORE_SERVICE_ACCOUNT_KEY_PATH: /tmp/keystore/release-key.json
          APK_PATH: maui/CountdownToUs.Maui.V2/bin/Release/net10.0-android/publish/*.apk
        run: |
          $aarPath = "maui\CountdownToUs.Maui.V2\bin\Release\net10.0-android\publish*.aar"

          # Upload the APK to the specified track (e.g., internal, alpha)
          dotnet tool install -g GooglePlayPublisher --no-redirect --version 3.0.0
          $apkDir = Split-Path -Parent "$env:APK_PATH"
          Get-ChildItem -Path "$env:APK_PATH" | ForEach-Object {
            $apkName = $_.Name
            & dotnet GooglePlayPublisher publish `
              --project-number="$env:PLAY_STORE_PROJECT_NUMBER" `
              --track="$env:PLAY_STORE_TRACK" `
              --service-account-key-file="$env:PLAY_STORE_SERVICE_ACCOUNT_KEY_PATH" `
              --package-name="com.npequeux.countdowntov2" `
              --file= "$apkDir/$($apkName)"

            # Upload the corresponding AAB for version tracking
            Get-ChildItem -Path "$aarPath" | ForEach-Object {
              & dotnet GooglePlayPublisher upload `
                --project-number="$env:PLAY_STORE_PROJECT_NUMBER" `
                --track="$env:PLAY_STORE_TRACK" `
                --service-account-key-file="$env:PLAY_STORE_SERVICE_ACCOUNT_KEY_PATH" `
                --file= "$_.FullName"
            }

            # Upload the APK as a release artifact for download
            & dotnet GooglePlayPublisher upload-artifact `
              --project-number="$env:PLAY_STORE_PROJECT_NUMBER" `
              --track="release" `
              --service-account-key-file="$env:PLAY_STORE_SERVICE_ACCOUNT_KEY_PATH" `
              --file= "$apkDir/$($apkName)"
          }

  publish-v2-android-release:
    runs-on: ubuntu-latest
    needs: build-v2-android
    permissions:
      contents: read
      id-token: write
    if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download V2 APK artifact from build
        uses: actions/download-artifact@v4
        with:
          name: CountdownToUs-V2-${{ runner.os }}
          path: artifacts

      - name: Publish V2 to Play Store (release)
        env:
          PLAY_STORE_PROJECT_NUMBER: ${{ vars.PLAY_STORE_PROJECT_NUMBER }}
          PLAY_STORE_SERVICE_ACCOUNT_KEY_PATH: /tmp/keystore/release-key.json
          APK_PATH: artifacts/*.apk
        run: |
          dotnet tool install -g GooglePlayPublisher --no-redirect --version 3.0.0
