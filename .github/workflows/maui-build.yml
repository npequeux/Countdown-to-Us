name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build-blazor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        run: dotnet restore blazor/CountdownToUs/CountdownToUs.csproj

      - name: Build Blazor project
        run: dotnet build blazor/CountdownToUs/CountdownToUs.csproj --no-restore --configuration Release

  build-maui-android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        run: dotnet restore maui/CountdownToUs.Maui/CountdownToUs.Maui.csproj

      - name: Build MAUI Android project
        shell: pwsh
        run: |
          dotnet build maui\CountdownToUs.Maui\CountdownToUs.Maui.csproj --no-restore --configuration Release -f net8.0-android

      - name: Publish MAUI Android
        shell: pwsh
        run: |
          dotnet publish maui\CountdownToUs.Maui\CountdownToUs.Maui.csproj --no-restore -c Release -f net8.0-android -p:PublishSingleFile=true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
          name: CountdownToUs.Android
          path: maui/CountdownToUs.Maui/bin/Release/net8.0-android/publish/

  build-maui-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        run: |
          export DOTNET_CLI_TELEMETRY_OPTOUT=1
          dotnet restore maui/CountdownToUs.Maui/CountdownToUs.Maui.csproj

      - name: Build MAUI iOS project
        shell: pwsh
        run: dotnet build maui\CountdownToUs.Maui\CountdownToUs.Maui.csproj --no-restore -c Release -f net8.0-ios

      - name: Publish MAUI iOS
        shell: pwsh
        run: |
          dotnet publish maui\CountdownToUs.Maui\CountdownToUs.Maui.csproj --no-restore -c Release -f net8.0-ios -p:PublishSingleFile=true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
          name: CountdownToUs.iOS
          path: maui/CountdownToUs.Maui/bin/Release/net8.0-ios/publish/
